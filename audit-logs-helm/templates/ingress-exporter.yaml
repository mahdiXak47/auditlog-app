{{- if .Values.ingress.exporter.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "audit-logs.fullname" . }}-exporter
  labels:
    app.kubernetes.io/name: {{ include "audit-logs.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: exporter
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  {{- with .Values.ingress.exporter.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.exporter.className }}
  ingressClassName: {{ .Values.ingress.exporter.className }}
  {{- end }}
  rules:
    {{- range .Values.ingress.exporter.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: {{ .path | default "/metrics" | quote }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "audit-logs.fullname" $ }}-exporter
                port:
                  number: 8080
    {{- end }}
  {{- with .Values.ingress.exporter.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

