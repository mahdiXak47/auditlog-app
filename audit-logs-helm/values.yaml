replicaCount: 
  auditLogs: 1
  exporter: 1

image: 
  auditLogs:
    repository: mahdixak/rbac-audit
    tag: "0.2"
    pullPolicy: IfNotPresent
  sidecar:
    repository: mahdixak/rbac-sidecar
    tag: "0.2"
    pullPolicy: IfNotPresent
  exporter:
    repository: mahdixak/rbac-exporter
    tag: "0.2"
    pullPolicy: IfNotPresent

serviceAccount: 
  create: true
  name: "rbac-audit"


rbac:
  create: true
  clusterRoleName: "fetch-audits"
  clusterRoleBindingName: "audit-fetcher"


config: 
  auditLogs:
    interval: 5m
    paths:
      inputPath: /shared/json-files/input.json
      outputJsonPath: /shared/reports.jsonl
      outputFlatJsonPath: /shared/reports-flat.jsonl
      debugOutputPath: /shared/json-files/output-of-the-code.json
    input: 
      existingConfigMap: "input-reader"
      key: input.json

  sidecar:
    flushEvery: 10
    pollEvery: 1s

  exporter:
    window: 24h
    pollEvery: 30s
    maxBuckets: 10
    listenAddr: ":8080"

elasticsearch:
  url: https://elasticsearch.mahdixak.ir
  index: audit-logs
  flatIndex: audit-logs-flat
  existingSecret: "es-credentials"   # name of a Secret created separately
  usernameKey: "username"            # key in that Secret
  passwordKey: "password"            # key in that Secret

ingress:
  exporter:
    enabled: false
    className: ""        # e.g. "nginx" if you use ingress-nginx
    annotations: {}
    hosts:
      - host: "metrics.mahdixak.ir"         
        path: /metrics
        pathType: Prefix
    tls: []              # e.g. [{ hosts: ["rbac-exporter.mahdixak.ir"], secretName: "rbac-exporter-tls" }]

resources: 
  auditLogs:
    requests:
      cpu: "500m"
      memory: "1Gi"
      ephemeral-storage: "512Mi"
    limits:
      cpu: "2"
      memory: "4Gi"
      ephemeral-storage: "512Mi"
  sidecar:
    requests:
      cpu: "500m"
      memory: "1Gi"
      ephemeral-storage: "512Mi"
    limits:
      cpu: "2"
      memory: "4Gi"
      ephemeral-storage: "512Mi"
  exporter:
    requests:
      cpu: "500m"
      memory: "1Gi"
      ephemeral-storage: "512Mi"
    limits:
      cpu: "2"
      memory: "4Gi"
      ephemeral-storage: "512Mi"


