# Set METRICS_USERNAME and METRICS_PASSWORD via your platform's env/config to enable basic auth.
# If METRICS_PASSWORD is empty, /metrics is served without authentication.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rbac-exporter
  labels:
    app.kubernetes.io/name: rbac-exporter
    app.kubernetes.io/component: exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rbac-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rbac-exporter
        app.kubernetes.io/component: exporter
    spec:
      containers:
        - name: rbac-exporter
          image: mahdixak/rbac-exporter:0.2
          imagePullPolicy: IfNotPresent
          env:
            - name: ELASTICSEARCH_URL
              value: "https://elasticsearch.mahdixak.ir"
            - name: ES_INDEX
              value: "audit-logs-flat"
            - name: WINDOW
              value: "24h"
            - name: POLL_EVERY
              value: "30s"
            - name: MAX_BUCKETS
              value: "10"
            - name: LISTEN_ADDR
              value: ":8080"
            - name: ES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: es-credentials
                  key: username
            - name: ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: es-credentials
                  key: password
            - name: METRICS_USERNAME
              value: "prometheus"
            # METRICS_PASSWORD: set via your platform's env (e.g. Darkube env vars).
            # When set, /metrics requires Basic auth (browser popup). Username=METRICS_USERNAME, password=METRICS_PASSWORD.
          ports:
            - name: http-metrics
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: rbac-exporter
  labels:
    app.kubernetes.io/name: rbac-exporter
    app.kubernetes.io/component: exporter
spec:
  type: ClusterIP
  ports:
    - name: http-metrics
      port: 8080
      targetPort: http-metrics
      protocol: TCP
  selector:
    app.kubernetes.io/name: rbac-exporter
